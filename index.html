<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>人工智能训练师完整题库刷题网站</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#12213a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .box{max-width:520px;padding:28px;text-align:center}.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #dbe4f5;border-top-color:#3568e8;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    .err{white-space:pre-wrap;text-align:left;background:#fff0ee;padding:16px;border-radius:12px;color:#a52922}
  </style>
</head>
<body>
  <div class="box" id="status"><div class="spinner"></div><div>正在加载完整题库，请稍候……</div></div>
  <noscript>请启用 JavaScript 后使用本刷题网站。</noscript>
  <script>
  (async()=>{
    try{
      const names=Array.from({length:14},(_,i)=>`parts/part-${String(i).padStart(2,'0')}.txt`);
      const texts=await Promise.all(names.map(async name=>{
        const r=await fetch(name,{cache:'no-store'});
        if(!r.ok) throw new Error(`题库分片加载失败：${name} (${r.status})`);
        return r.text();
      }));
      const b64=texts.join('').replace(/\s/g,'');
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      if(!('DecompressionStream' in window)) throw new Error('当前浏览器版本过低，暂不支持解压题库。请升级 iOS、Safari、微信或其他浏览器后重试。');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(err){
      document.getElementById('status').innerHTML=`<div class="err"><strong>网站加载失败</strong>\n\n${String(err.message||err)}\n\n请检查网络后刷新页面，或改用最新版 Safari、Chrome、Edge、微信打开。</div>`;
    }
  })();
  </script>
</body>
</html>
